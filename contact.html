<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<style>
    .contact{
    padding: 80px 10%;
    background: #000;
    color: white;
}

.contact h2{
    text-align: center;
    font-size: 40px;
    margin-bottom: 50px;
}

.contact-container{
    display: flex;
    justify-content: space-between;
    gap: 50px;
    flex-wrap: wrap;
}

.contact-info{
    flex: 1;
    min-width: 300px;
}

.contact-info h3{
    font-size: 28px;
    margin-bottom: 20px;
}

.contact-info p{
    margin: 20px 0;
    font-size: 18px;
}

.contact-info i{
    color: #00bfff;
    margin-right: 10px;
}

.contact-form{
    flex: 1;
    min-width: 300px;
}

.contact-form input,
.contact-form textarea{
    width: 100%;
    padding: 15px;
    margin-bottom: 15px;
    border: none;
    border-radius: 5px;
    outline: none;
}

.contact-form button{
    background: #00bfff;
    color: white;
    border: none;
    padding: 10px 15px;
    cursor: pointer;
    border-radius: 5px;
    font-size: 12px;
}

.contact-form button:hover{
    background: #009acd;
}
.back-btn{
    display: inline-block;
    margin: 20px;
    padding: 10px 10px;
    background-color: #00abf0;
    color: white;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
    transition: 0.3s;
}

.back-btn:hover{
    background-color: #0086c3;
}
</style>
<body>
 
     <section id="contact" class="contact">
         <a href="home.html" class="back-btn">← Back to Home</a>
    <h2>Contact Me</h2>

    <div class="contact-container">

        <!-- Contact Information -->
        <div class="contact-info">
            <h3>Get In Touch</h3>

            <p>
                <i class="fas fa-map-marker-alt"></i>
                Nairobi,<br> Kenya
            </p>

            <p>
                <i class="fas fa-phone"></i>
                +254 795169251
            </p>

            <p>
                <i class="fas fa-envelope"></i>
                wawerugeoffrey505@gmail.com
            </p>
        </div>
       

        <!-- Contact Form -->
        <div class="contact-form">
            <form>
                <input type="text" placeholder="Your Name/Company" required>

                <input type="email" placeholder="Your Email" required>

                <textarea placeholder="Your Message" rows="6" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </div>

    </div>
</section>
    
</body>
</html>
